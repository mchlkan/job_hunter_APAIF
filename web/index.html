<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>jobhunter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wordmark">
      <span class="mark" aria-hidden="true">&#9992;</span>
      jobhunter
    </div>
    <div id="candidate-strip" class="candidate-status">
      <span class="candidate-empty">No CV on file yet</span>
    </div>
    <label class="add-cv">
      Add CV
      <input id="f-cv" type="file" accept="application/pdf" hidden />
    </label>
  </header>

  <section class="hero">
    <h1>Find your next data &amp; analytics role.</h1>
    <p class="hero-sub" id="stats-line">
      <span id="stat-total">&mdash;</span> postings tracked &middot;
      <span id="stat-scored">&mdash;</span> scored &middot;
      <span id="stat-sources"></span>
    </p>

    <div class="search-bar">
      <div class="field field-grow">
        <label for="f-q">Search</label>
        <input id="f-q" type="search" placeholder="Title or company" autocomplete="off" />
      </div>
      <div class="field">
        <label for="f-source">Source</label>
        <select id="f-source">
          <option value="">All sources</option>
          <option value="arbeitsagentur">Bundesagentur</option>
          <option value="arbeitnow">Arbeitnow</option>
          <option value="eures">EURES</option>
        </select>
      </div>
      <div class="field">
        <label for="f-remote">Location</label>
        <select id="f-remote">
          <option value="">On-site or remote</option>
          <option value="true">Remote only</option>
          <option value="false">On-site only</option>
        </select>
      </div>
    </div>
  </section>

  <main>
    <ul id="job-list" class="job-list" aria-live="polite"></ul>
    <p id="empty-state" class="empty-state" hidden>No postings match these filters. Try widening them.</p>
  </main>

  <div id="detail-panel" class="detail-panel" hidden>
    <div class="detail-panel-inner">
      <button id="detail-close" class="detail-close" aria-label="close">&times;</button>
      <div id="detail-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
