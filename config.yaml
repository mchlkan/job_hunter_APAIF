# wo is a normalized filter across all three sources (see sources.py's
# COUNTRY_CODES / _resolve_country):
#   ""            no location filter — Arbeitsagentur -> nationwide Germany,
#                 Arbeitnow -> EU-wide unfiltered, Eures -> all EU/EEA
#                 countries unfiltered (bounded by fetch.eures.max_pages)
#   "Germany"     Arbeitsagentur -> nationwide (same as ""); Arbeitnow/Eures
#                 -> only postings tagged/located in Germany
#   "Spain" etc.  a recognized EU country -> Arbeitsagentur returns nothing
#                 (Germany-only by nature); Arbeitnow/Eures filter to it
#   "Berlin" etc. an unrecognized name is treated as a city: Arbeitsagentur
#                 uses it as a real city+radius search; Arbeitnow matches it
#                 as a location substring; Eures has no city filter, so it
#                 falls back to unfiltered (same as "")
#   "Remote"      Arbeitnow -> remote-flagged jobs only; Arbeitsagentur and
#                 Eures have no remote flag, so this returns nothing for them
searches:
  - was: "Data Analyst"
    wo: ""
    umkreis: 0
  - was: "Business Intelligence"
    wo: ""
    umkreis: 0
  - was: "Werkstudent Data"
    wo: ""
    umkreis: 0

fetch:
  arbeitsagentur:
    size: 100
    veroeffentlichtseit: 7
    pav: false
    max_pages: 10
    sleep_seconds: 0.5
  arbeitnow:
    max_pages: 5
    sleep_seconds: 0.3
  eures:
    # Unfiltered/no-country queries do loose per-word matching over a huge
    # corpus (e.g. "Data Analyst" alone = ~450k EU-wide) — max_pages is what
    # keeps that bounded, same role it plays for arbeitnow. A country-scoped
    # search (wo: "Spain") is far more precise and can use more pages safely.
    results_per_page: 50
    max_pages: 5
    sleep_seconds: 0.3

db_path: "data/jobs.db"
