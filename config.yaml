# wo: "" means no location filter — Arbeitsagentur falls back to nationwide
# Germany (it has no EU reach), Arbeitnow falls back to EU-wide unfiltered.
# Set wo to a city ("Berlin") or "Remote" to narrow either source.
searches:
  - was: "Data Analyst"
    wo: ""
    umkreis: 0
  - was: "Business Intelligence"
    wo: ""
    umkreis: 0
  - was: "Werkstudent Data"
    wo: ""
    umkreis: 0

fetch:
  arbeitsagentur:
    size: 100
    veroeffentlichtseit: 7
    pav: false
    max_pages: 10
    sleep_seconds: 0.5
  arbeitnow:
    max_pages: 5
    sleep_seconds: 0.3

db_path: "data/jobs.db"
